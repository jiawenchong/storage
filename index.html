<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>商品庫存</title>
<style>
  :root {
    --bg: #f5f5f4;
    --card: #ffffff;
    --text: #1c1917;
    --muted: #78716c;
    --line: #e7e5e4;
    --accent: #2563eb;
    --danger: #dc2626;
    --low: #fef3c7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1917;
      --card: #292524;
      --text: #f5f5f4;
      --muted: #a8a29e;
      --line: #44403c;
      --accent: #60a5fa;
      --danger: #f87171;
      --low: #422006;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
  }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 0 0 16px; }
  form, .list, .tools {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px;
  }
  form { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  input {
    font: inherit;
    color: inherit;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 10px;
    min-width: 0;
  }
  #name { flex: 1 1 160px; }
  #qty { flex: 0 0 90px; }
  #search { width: 100%; margin-bottom: 8px; }
  button {
    font: inherit;
    border: 1px solid var(--line);
    background: transparent;
    color: inherit;
    border-radius: 8px;
    padding: 8px 12px;
    cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--danger); }
  .row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 4px;
    border-top: 1px solid var(--line);
  }
  .row:first-of-type { border-top: none; }
  .row.low { background: var(--low); border-radius: 8px; }
  .row .name { flex: 1; overflow-wrap: anywhere; }
  .row .count {
    width: 64px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .row button { padding: 6px 10px; }
  .empty { color: var(--muted); text-align: center; padding: 24px 0; }
  .summary { color: var(--muted); font-size: .9rem; margin: 8px 4px 0; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
  .tools p { margin: 0; width: 100%; color: var(--muted); font-size: .85rem; }
</style>
</head>
<body>
<main>
  <h1>商品庫存</h1>

  <form id="add-form">
    <input id="name" placeholder="商品名稱" required>
    <input id="qty" type="number" min="0" value="1" required>
    <button class="primary" type="submit">新增</button>
  </form>

  <div class="list">
    <input id="search" type="search" placeholder="搜尋商品…">
    <div id="items"></div>
    <div class="summary" id="summary"></div>
  </div>

  <div class="tools">
    <p>資料儲存在此瀏覽器中。換裝置或清除瀏覽器資料前，請先匯出備份。</p>
    <button id="export">匯出備份</button>
    <button id="import">匯入備份</button>
    <input id="import-file" type="file" accept="application/json" hidden>
  </div>
</main>

<script>
  const KEY = 'inventory-items';
  const LOW_STOCK = 3;
  let items = load();

  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || []; }
    catch { return []; }
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(items)); } catch {}
  }

  function render() {
    const box = document.getElementById('items');
    const q = document.getElementById('search').value.trim().toLowerCase();
    const shown = items.filter(i => i.name.toLowerCase().includes(q));
    box.innerHTML = '';

    if (!shown.length) {
      box.innerHTML = `<div class="empty">${items.length ? '找不到符合的商品' : '還沒有商品，從上方新增吧'}</div>`;
    }

    for (const item of shown) {
      const row = document.createElement('div');
      row.className = 'row' + (item.qty <= LOW_STOCK ? ' low' : '');

      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = item.name;

      const minus = document.createElement('button');
      minus.textContent = '−';
      minus.onclick = () => setQty(item, item.qty - 1);

      const count = document.createElement('input');
      count.className = 'count';
      count.type = 'number';
      count.min = '0';
      count.value = item.qty;
      count.onchange = () => setQty(item, parseInt(count.value, 10) || 0);

      const plus = document.createElement('button');
      plus.textContent = '+';
      plus.onclick = () => setQty(item, item.qty + 1);

      const del = document.createElement('button');
      del.className = 'danger';
      del.textContent = '刪除';
      del.onclick = () => {
        if (confirm(`確定刪除「${item.name}」？`)) {
          items = items.filter(i => i !== item);
          save();
          render();
        }
      };

      row.append(name, minus, count, plus, del);
      box.append(row);
    }

    const total = items.reduce((s, i) => s + i.qty, 0);
    document.getElementById('summary').textContent =
      items.length ? `共 ${items.length} 項商品，總數量 ${total}` : '';
  }

  function setQty(item, qty) {
    item.qty = Math.max(0, qty);
    save();
    render();
  }

  document.getElementById('add-form').onsubmit = e => {
    e.preventDefault();
    const name = document.getElementById('name').value.trim();
    const qty = Math.max(0, parseInt(document.getElementById('qty').value, 10) || 0);
    if (!name) return;

    const existing = items.find(i => i.name === name);
    if (existing) existing.qty += qty;
    else items.push({ name, qty });

    save();
    render();
    e.target.reset();
    document.getElementById('name').focus();
  };

  document.getElementById('search').oninput = render;

  document.getElementById('export').onclick = () => {
    const blob = new Blob([JSON.stringify(items, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `inventory-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
  };

  document.getElementById('import').onclick = () => document.getElementById('import-file').click();

  document.getElementById('import-file').onchange = async e => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      if (!Array.isArray(data)) throw new Error();
      if (!confirm('匯入會取代目前的庫存資料，確定嗎？')) return;
      items = data
        .filter(i => i && typeof i.name === 'string')
        .map(i => ({ name: i.name, qty: Math.max(0, parseInt(i.qty, 10) || 0) }));
      save();
      render();
    } catch {
      alert('檔案格式不正確');
    } finally {
      e.target.value = '';
    }
  };

  render();
</script>
</body>
</html>
